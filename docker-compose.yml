# Dokploy compose stack: a single app container serving the SPA + API, plus
# Postgres. POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB all match the project
# name. Set POSTGRES_PASSWORD in the Dokploy environment UI — do not commit it.
#
# A clean VM needs nothing else: `docker compose up -d` migrates, seeds the
# regions, and serves the site.

services:
  app:
    build:
      context: .
      args:
        VITE_AUTH_URL: ${VITE_AUTH_URL:-https://auth.monashcoding.com}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://mac_resource_hub:${POSTGRES_PASSWORD:-mac_resource_hub}@db:5432/mac_resource_hub
      AUTH_URL: ${AUTH_URL:-https://auth.monashcoding.com}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-mac-suite}
      MAC_ADMIN_ROLES: ${MAC_ADMIN_ROLES:-exec,committee}
      PORT: "3000"
    depends_on:
      db:
        condition: service_healthy
    # No host port on the shared Dokploy VM (collides with other apps). Instead
    # the app joins Dokploy's Traefik network and declares routing via labels.
    expose:
      - "3000"
    networks:
      - dokploy-network
      - internal
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.resource-hub.rule=Host(`${APP_DOMAIN:-resources.monashcoding.com}`)
      - traefik.http.routers.resource-hub.entrypoints=websecure
      - traefik.http.routers.resource-hub.tls.certresolver=letsencrypt
      - traefik.http.services.resource-hub.loadbalancer.server.port=3000
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mac_resource_hub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mac_resource_hub}
      POSTGRES_DB: mac_resource_hub
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mac_resource_hub"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db-data:

networks:
  # Dokploy's shared proxy network — created by Dokploy, so we join it as external.
  dokploy-network:
    external: true
  internal:
    driver: bridge
